server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  # aucune URL (et donc aucun jeton) n'est transmise aux sites tiers
  add_header Referrer-Policy "no-referrer" always;

  # DNS de Docker relu toutes les 10 s : un hôte littéral n'est résolu qu'au démarrage, et un
  # backend recréé (nouvelle IP) laissait « Serveur injoignable » jusqu'au redémarrage de nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $sportsplitter_api http://backend:8000;

  location /api/ {
    proxy_pass $sportsplitter_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # page de passation Orqea : jamais mise en cache
  location = /sso {
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
