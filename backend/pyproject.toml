[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Idiome FastAPI : ces appels en valeur par defaut sont resolus par le framework.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Body"]
