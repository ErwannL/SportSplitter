name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Release pushed tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # - name: Set up Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '21'

      # - name: Install dependencies
      #   run: npm install

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v$(grep -o '"version": *"[^"]*"' package.json | awk -F'"' '{print $4}') \
              --repo="" \
              --title="Release v$(grep -o '"version": *"[^"]*"' package.json | awk -F'"' '{print $4}')" \
              --target main

