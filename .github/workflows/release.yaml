name: Create a Release Automatically

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v2

    - name: Get version from package.json
      id: get_version
      run: echo "version=$(jq -r .version package.json)" >> $GITHUB_STATE

    - name: Install Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Build with make
      run: make build

    - name: Create a Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        release_name: Release v${{ steps.get_version.outputs.version }}
        body: New features, bug fixes, etc.
        draft: false
        prerelease: false

    - name: Save version as output
      run: echo "version=${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
