name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Release creation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Launch app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make build

      - name: Check for executable
        run: |
          if [ -f "dist/sport_splitter Setup $(grep -o '"version": *"[^"]*"' package.json | awk -F'"' '{print $4}')"] ]; then
            echo "Executable found!"
          else
            echo "Error: Executable not found in dist directory!"
            exit 1
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' package.json | awk -F'"' '{print $4}')
          gh release create v$VERSION \
              --repo="" \
              --title="Release v$VERSION" \
              --target main \
              --attach="dist/sport_splitter Setup $VERSION.exe"
