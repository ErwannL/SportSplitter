name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Release creation
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Launch app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make build

      - name: Check for executable
        run: |
          $json = Get-Content package.json -Raw | ConvertFrom-Json
          $name = $json.name
          $version = $json.version
          $search_dir = "dist"
          $exe_file = "${name}_Setup_${version}.exe"

          if (Test-Path "$search_dir\$exe_file") {
              Write-Output "Executable found!"
          } else {
              Write-Output "Error: Executable not found in dist directory!"
              Write-Output "Contents of variables:"
              Write-Output "Name: $name"
              Write-Output "Version: $version"
              Write-Output "Contents of dist directory:"
              Get-ChildItem -Path $search_dir
              exit 1
          }

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          json=$(cat package.json)
          NAME=$(echo "$json" | grep -o '"name": *"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"')
          VERSION=$(echo "$json" | grep -o '"version": *"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"')
          gh release create v$VERSION \
              --repo="" \
              --title="Release v$VERSION" \
              --target main \
              --attach="dist/$NAME Setup $VERSION.exe"
