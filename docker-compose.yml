services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportsplitter
      POSTGRES_PASSWORD: sportsplitter
      POSTGRES_DB: sportsplitter
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsplitter"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sportsplitter:sportsplitter@db:5432/sportsplitter
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
